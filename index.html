<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standby Roster</title>
<style>
:root{
  --ink:#12151C; --surface:#1C212B; --surface2:#262D3A; --line:#333C4A;
  --text:#EAEEF4; --muted:#8C97A8; --muted2:#6B7688;
  --live:#34E0C4; --live-dim:#1f6b5e; --warn:#FFB454; --leave:#8B9BFF; --danger:#FF6B6B;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono",Menlo,Consolas,monospace;
  --radius:14px; --radius-sm:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink); color:var(--text); font-family:var(--font);
  line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:24px 16px 64px; min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto}

/* top bar */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
.brand h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700}
.brand .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* buttons */
.btn{font-family:var(--font);font-size:13px;font-weight:600;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .05s}
.btn:hover{border-color:var(--muted2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.btn-primary{background:var(--live);color:#08130f;border-color:transparent}
.btn-primary:hover{filter:brightness(1.06);border-color:transparent}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.select-inline{font-family:var(--font);font-size:13px;font-weight:600;color:var(--text);
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px}

/* section labels */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted2);margin:0 0 10px}

/* now card — the hero */
.now{background:linear-gradient(180deg,rgba(52,224,196,.09),rgba(52,224,196,.02));
  border:1px solid var(--live-dim);border-radius:var(--radius);padding:22px 22px 18px;margin-bottom:34px;
  position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--live)}
.now .live-row{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(52,224,196,.6);
  animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,224,196,.5)}70%{box-shadow:0 0 0 10px rgba(52,224,196,0)}100%{box-shadow:0 0 0 0 rgba(52,224,196,0)}}
.live-tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--live)}
.now .who{font-size:34px;font-weight:750;letter-spacing:-.01em;line-height:1.1;margin:0}
.now .when{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:10px}
.now .when b{color:var(--text);font-weight:600}
.now .cover-note{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:13px;
  color:var(--warn);font-family:var(--mono)}
.now .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

/* horizontal day strip inside the now card */
.day-strip{display:flex;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.day-cell{flex:0 0 auto;min-width:46px;text-align:center;padding:8px 4px 7px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--pc,var(--line))}
.day-cell .dname{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.day-cell .dnum{font-size:15px;font-weight:700;margin-top:2px}
.day-cell.is-today{border-color:var(--live)}
.day-cell.is-today .dname{color:var(--live)}
.day-cell.needs{border-color:rgba(255,180,84,.5)}
.day-cell.needs .dnum{color:var(--warn)}

/* week strip */
.strip{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden}
.week{display:grid;grid-template-columns:132px 1fr auto;align-items:center;gap:14px;
  background:var(--surface);padding:13px 16px;border-left:3px solid var(--pc,transparent)}
.week.is-now{background:var(--surface2)}
.week .range{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.week .range .yr{color:var(--muted2)}
.week .person{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.week .person .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.badge.needs{color:var(--warn);border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.08)}
.badge.cover{color:var(--leave);border-color:rgba(139,155,255,.4);background:rgba(139,155,255,.08)}
.badge.you{color:var(--live);border-color:rgba(52,224,196,.4);background:rgba(52,224,196,.08)}
.week .cover-btn{font-family:var(--font);font-size:12px;font-weight:600;color:var(--muted);
  background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.week .cover-btn:hover{color:var(--text);border-color:var(--muted2)}
.strike{color:var(--muted2);text-decoration:line-through;text-decoration-color:var(--muted2)}

/* leave list */
.leave-list{margin-top:22px}
.leave-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc,var(--line));
  border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:8px}
.leave-row .l-main{font-size:14px}
.leave-row .l-dates{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.leave-row .l-note{color:var(--muted);font-style:italic}

.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);
  border-radius:var(--radius-sm);text-align:center}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.66);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.overlay[hidden]{display:none}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  width:100%;max-width:440px;padding:24px;max-height:88vh;overflow:auto}
.dialog h2{margin:0 0 4px;font-size:19px;font-weight:700}
.dialog .hint{color:var(--muted);font-size:13px;margin:0 0 18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-family:var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:var(--font);font-size:14px;
  color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:10px 12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--live)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.member-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.member-edit .drag{font-family:var(--mono);color:var(--muted2);font-size:12px;width:22px;text-align:center}
.member-fields{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.member-fields input{width:100%;font-family:var(--font);font-size:13px;color:var(--text);
  background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.member-fields input:focus{outline:none;border-color:var(--live)}
.member-fields input[data-email]{color:var(--muted);font-family:var(--mono);font-size:12px}
.mode-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.mode-tag.shared{color:var(--live);border-color:var(--live-dim)}

@media (max-width:560px){
  .now .who{font-size:27px}
  .week{grid-template-columns:1fr;gap:6px}
  .week .badges{justify-content:flex-start}
  .week .range{order:-1}
}
@media (prefers-reduced-motion:reduce){ .dot{animation:none} }
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="modal" hidden><div class="dialog" role="dialog" aria-modal="true"></div></div>
<script>
/* =====================================================================
   SHARED MODE — paste your Supabase project values here to switch the
   roster from "just this browser" to "everyone sees the same thing".
   Leave both blank to run in local demo mode. See README for setup.
   ===================================================================== */
const SUPABASE_URL = "https://tczjlkjlntykligbfqgb.supabase.co";       // e.g. "https://xxxx.supabase.co"
const SUPABASE_ANON_KEY = "sb_publishable_nmSTIaycmIUf4cy8ngkEPg_2X3UBOiA";  // your project's public anon key
/* ---------------------------------------------------------------
   Standby Roster — pure domain logic (no DOM, no storage).
   Dates are ISO date strings "YYYY-MM-DD" and handled in UTC
   to avoid timezone/DST drift on a single client.
   --------------------------------------------------------------- */

function toUTC(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}
function fromUTC(ms) {
  const dt = new Date(ms);
  const y = dt.getUTCFullYear();
  const m = String(dt.getUTCMonth() + 1).padStart(2, '0');
  const d = String(dt.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
const DAY = 86400000;

function addDaysStr(dateStr, n) { return fromUTC(toUTC(dateStr) + n * DAY); }
function daysBetween(aStr, bStr) { return Math.round((toUTC(bStr) - toUTC(aStr)) / DAY); }

function todayStr() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// Monday-based start of the week containing dateStr (weekStartsOn: 0=Sun..6=Sat)
function weekStart(dateStr, weekStartsOn = 1) {
  const dow = new Date(toUTC(dateStr)).getUTCDay(); // 0..6
  const diff = (dow - weekStartsOn + 7) % 7;
  return addDaysStr(dateStr, -diff);
}

// Which rotation period does dateStr fall in? (can be negative before start)
function periodIndex(dateStr, startStr, cadenceDays) {
  return Math.floor(daysBetween(startStr, dateStr) / cadenceDays);
}
function periodStartStr(index, startStr, cadenceDays) {
  return addDaysStr(startStr, index * cadenceDays);
}
function periodEndStr(index, startStr, cadenceDays) {
  // exclusive end (start of next period)
  return addDaysStr(startStr, (index + 1) * cadenceDays);
}
function periodLastDayStr(index, startStr, cadenceDays) {
  return addDaysStr(periodEndStr(index, startStr, cadenceDays), -1);
}

// Base person in the plain rotation, ignoring overrides/leave.
function baseMemberId(index, members) {
  if (!members.length) return null;
  const n = members.length;
  return members[((index % n) + n) % n].id;
}

// Effective person for a period: an override wins over the base rotation.
function effective(index, startStr, cadenceDays, members, overrides) {
  const base = baseMemberId(index, members);
  const key = periodStartStr(index, startStr, cadenceDays);
  const ov = overrides[key];
  if (ov && ov.memberId) return { memberId: ov.memberId, overridden: true, baseMemberId: base };
  return { memberId: base, overridden: false, baseMemberId: base };
}

// Does a leave record overlap the period [pStart, pLastDay]?
function leaveOverlapsPeriod(leave, pStartStr, pLastDayStr) {
  return leave.start <= pLastDayStr && leave.end >= pStartStr;
}

// Find a leave for the effective member that collides with this period.
function conflictForPeriod(index, startStr, cadenceDays, members, overrides, leaves) {
  const eff = effective(index, startStr, cadenceDays, members, overrides);
  if (!eff.memberId) return null;
  const pStart = periodStartStr(index, startStr, cadenceDays);
  const pLast = periodLastDayStr(index, startStr, cadenceDays);
  const hit = leaves.find(l => l.memberId === eff.memberId && leaveOverlapsPeriod(l, pStart, pLast));
  return hit || null;
}

// Build a window of periods for rendering.
function buildPeriods(fromIndex, count, startStr, cadenceDays, members, overrides, leaves) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const idx = fromIndex + i;
    const eff = effective(idx, startStr, cadenceDays, members, overrides);
    const conflict = conflictForPeriod(idx, startStr, cadenceDays, members, overrides, leaves);
    out.push({
      index: idx,
      start: periodStartStr(idx, startStr, cadenceDays),
      lastDay: periodLastDayStr(idx, startStr, cadenceDays),
      end: periodEndStr(idx, startStr, cadenceDays),
      memberId: eff.memberId,
      overridden: eff.overridden,
      baseMemberId: eff.baseMemberId,
      needsCover: !!conflict,
      conflict: conflict,
    });
  }
  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    toUTC, fromUTC, addDaysStr, daysBetween, todayStr, weekStart,
    periodIndex, periodStartStr, periodEndStr, periodLastDayStr,
    baseMemberId, effective, leaveOverlapsPeriod, conflictForPeriod, buildPeriods,
  };
}
/* Standby Roster — app layer (DOM, storage adapters, rendering).
   Depends on the pure functions from domain.js (loaded before this). */

const APP = { store:null, mode:'local', state:null, identity:null, session:null };
const IDKEY = 'standby_identity_v1';

function uid(){ return 'x' + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parts(s){ const [y,m,d]=s.split('-').map(Number); return {y,m:MON[m-1],mn:m,d}; }
function dow(s){ return DOW[new Date(toUTC(s)).getUTCDay()]; }
function fmtRange(a,b){ const A=parts(a),B=parts(b);
  if(A.mn===B.mn && A.y===B.y) return `${A.d}–${B.d} ${B.m}`;
  if(A.y===B.y) return `${A.d} ${A.m} – ${B.d} ${B.m}`;
  return `${A.d} ${A.m} ${A.y} – ${B.d} ${B.m} ${B.y}`; }
function fmtDay(s){ const P=parts(s); return `${dow(s)} ${P.d} ${P.m}`; }
function nameOf(id){ const m=(APP.state.members||[]).find(x=>x.id===id); return m?m.name:'—'; }

// Per-person accent colors — dark-mode-validated categorical hues (CVD-safe
// adjacent order), green dropped: it fails 3:1 contrast on --surface2 here
// and reads too close to the app's own --live teal "you/current" accent.
const PERSON_COLORS = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#9085e9','#e66767'];
function colorFor(id){
  if(!id) return null;
  const idx = (APP.state.members||[]).findIndex(m=>m.id===id);
  return idx<0 ? null : PERSON_COLORS[idx % PERSON_COLORS.length];
}

// Per-day breakdown: like buildPeriods, but one entry per calendar day rather
// than per rotation period, so leave conflicts land on the exact day they hit.
function buildDays(fromDateStr, count, config, members, overrides, leaves) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const date = addDaysStr(fromDateStr, i);
    const idx = periodIndex(date, config.startDate, config.cadenceDays);
    const eff = effective(idx, config.startDate, config.cadenceDays, members, overrides);
    const hit = eff.memberId ? leaves.find(l => l.memberId === eff.memberId && l.start <= date && l.end >= date) : null;
    out.push({
      date,
      periodStart: periodStartStr(idx, config.startDate, config.cadenceDays),
      memberId: eff.memberId,
      overridden: eff.overridden,
      needsCover: !!hit,
      conflict: hit,
    });
  }
  return out;
}

function makeDefaultState(){
  const start = weekStart(todayStr(), 1);
  const members = ['Alex Rivera','Sam Okafor','Priya Shah','Jordan Lee'].map(n=>({id:uid(),name:n}));
  const nextWeek = addDaysStr(start,7);
  const leaves = [{ id:uid(), memberId:members[1].id, start:nextWeek, end:addDaysStr(nextWeek,4), note:'Annual leave (demo)', by:'demo' }];
  return { config:{ team:'Ops Standby', startDate:start, cadenceDays:7 }, members, leaves, overrides:[] };
}

/* ---------------- storage adapters ---------------- */
class LocalStore {
  constructor(){ this.key='standby_roster_v1'; this.cb=null; }
  async load(){
    const raw = localStorage.getItem(this.key);
    if(raw){ try{ return JSON.parse(raw); }catch(e){} }
    const seed = makeDefaultState();
    localStorage.setItem(this.key, JSON.stringify(seed));
    return seed;
  }
  subscribe(cb){ this.cb=cb; window.addEventListener('storage', e=>{ if(e.key===this.key) cb(); }); }
  async _mutate(fn){ const s=await this.load(); fn(s); localStorage.setItem(this.key, JSON.stringify(s)); if(this.cb) this.cb(); }
  addLeave(r){ return this._mutate(s=>s.leaves.push(r)); }
  deleteLeave(id){ return this._mutate(s=>{ s.leaves=s.leaves.filter(l=>l.id!==id); }); }
  setOverride(r){ return this._mutate(s=>{ s.overrides=s.overrides.filter(o=>o.periodStart!==r.periodStart); s.overrides.push(r); }); }
  clearOverride(ps){ return this._mutate(s=>{ s.overrides=s.overrides.filter(o=>o.periodStart!==ps); }); }
  saveMembers(members){ return this._mutate(s=>{ s.members=members; }); }
  saveConfig(config){ return this._mutate(s=>{ s.config={...s.config,...config}; }); }
}

class SupabaseStore {
  constructor(url,key){ this.sb=window.supabase.createClient(url,key); this.cb=null; }
  async load(){
    const [cfg,members,leaves,overrides] = await Promise.all([
      this.sb.from('config').select('*').eq('id',1).maybeSingle(),
      this.sb.from('members').select('*').order('sort',{ascending:true}),
      this.sb.from('leaves').select('*'),
      this.sb.from('overrides').select('*'),
    ]);
    const err = cfg.error||members.error||leaves.error||overrides.error;
    if(err) throw err;
    const c = cfg.data;
    return {
      config: c ? {team:c.team, startDate:c.start_date, cadenceDays:c.cadence_days}
                : {team:'Ops Standby', startDate:weekStart(todayStr(),1), cadenceDays:7},
      members: (members.data||[]).map(m=>({id:m.id, name:m.name, email:m.email||''})),
      leaves: (leaves.data||[]).map(l=>({id:l.id, memberId:l.member_id, start:l.start_date, end:l.end_date, note:l.note, by:l.created_by})),
      overrides: (overrides.data||[]).map(o=>({id:o.id, periodStart:o.period_start, memberId:o.member_id, note:o.note, by:o.created_by})),
    };
  }
  subscribe(cb){ this.cb=cb;
    this.sb.channel('roster-any').on('postgres_changes',{event:'*',schema:'public'},()=>cb()).subscribe(); }
  async _t(p){ const {error}=await p; if(error) alert('Save failed: '+error.message); }
  addLeave(r){ return this._t(this.sb.from('leaves').insert({member_id:r.memberId,start_date:r.start,end_date:r.end,note:r.note,created_by:r.by})); }
  deleteLeave(id){ return this._t(this.sb.from('leaves').delete().eq('id',id)); }
  setOverride(r){ return this._t(this.sb.from('overrides').upsert({period_start:r.periodStart,member_id:r.memberId,note:r.note,created_by:r.by},{onConflict:'period_start'})); }
  clearOverride(ps){ return this._t(this.sb.from('overrides').delete().eq('period_start',ps)); }
  async saveMembers(members){
    const rows = members.map((m,i)=>({id:m.id,name:m.name,email:m.email||null,sort:i}));
    await this._t(this.sb.from('members').upsert(rows));
    const keep = members.map(m=>m.id);
    const {data}=await this.sb.from('members').select('id');
    const remove=(data||[]).map(x=>x.id).filter(id=>!keep.includes(id));
    if(remove.length) await this._t(this.sb.from('members').delete().in('id',remove));
  }
  saveConfig(config){ return this._t(this.sb.from('config').upsert({id:1,team:config.team,start_date:config.startDate,cadence_days:config.cadenceDays})); }
}

function loadSupabase(){
  return new Promise((res)=>{
    if(window.supabase) return res(true);
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload=()=>res(true); s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
}

/* ---------------- rendering ---------------- */
function setIdentity(id){ APP.identity=id||null; if(id) localStorage.setItem(IDKEY,id); else localStorage.removeItem(IDKEY); render(); }

function render(){
  const st = APP.state; if(!st) return;
  const { members, config, overrides, leaves } = st;
  const ovMap = {}; overrides.forEach(o=>{ ovMap[o.periodStart]=o; });
  const cad = config.cadenceDays, start = config.startDate;
  const today = todayStr();
  const curIdx = members.length ? periodIndex(today, start, cad) : 0;
  const weeks = members.length ? buildPeriods(curIdx, 9, start, cad, members, ovMap, leaves) : [];
  const now = weeks[0];

  const modeTag = APP.mode==='shared'
    ? '<span class="mode-tag shared">● shared</span>'
    : `<span class="mode-tag" title="Edits stay in this browser until shared mode is set up">local preview</span>`;

  const idOptions = ['<option value="">I\'m…</option>']
    .concat(members.map(m=>`<option value="${m.id}"${m.id===APP.identity?' selected':''}>${esc(m.name)}</option>`)).join('');

  /* now card */
  let nowHtml;
  if(!members.length){
    nowHtml = `<div class="now"><p class="eyebrow">On standby now</p>
      <div class="empty">No one's in the rotation yet. Open <b>Setup</b> to add your team.</div></div>`;
  } else {
    const end = periodEndStr(now.index, start, cad);
    const dleft = daysBetween(today, end);
    const handover = dleft<=0 ? 'handover due' : dleft===1 ? 'handover tomorrow' : `handover in ${dleft} days`;
    const coverLine = now.needsCover
      ? `<div class="cover-note">▲ ${esc(nameOf(now.conflict.memberId))} is on leave this week — needs cover</div>` : '';

    const nowColor = colorFor(now.memberId);
    const periodDays = buildDays(now.start, cad, config, members, ovMap, leaves);
    const dayStripHtml = `<div class="day-strip" style="--pc:${nowColor}">${periodDays.map(d=>{
      const isToday = d.date===today;
      const cls = ['day-cell']; if(isToday) cls.push('is-today'); if(d.needsCover) cls.push('needs');
      return `<div class="${cls.join(' ')}"><div class="dname">${dow(d.date)}</div><div class="dnum">${parts(d.date).d}</div></div>`;
    }).join('')}</div>`;

    nowHtml = `<div class="now">
      <div class="live-row"><span class="dot"></span><span class="live-tag">On standby now</span></div>
      <p class="who" style="color:${nowColor}">${esc(nameOf(now.memberId))}</p>
      <div class="when"><b>${fmtDay(now.start)}</b> – ${fmtDay(now.lastDay)} · ${handover}</div>
      ${dayStripHtml}
      ${coverLine}
      <div class="actions">
        <button class="btn" data-action="leave">Mark leave</button>
        <button class="btn" data-action="cover" data-period="${now.start}">Swap / cover this week</button>
      </div></div>`;
  }

  /* week strip */
  const rows = weeks.map((w,i)=>{
        const isYou = w.memberId===APP.identity;
        const badges = [];
        if(i===0) badges.push('<span class="badge you" style="color:var(--muted);border-color:var(--line)">this week</span>');
        if(w.overridden) badges.push(`<span class="badge cover">covered</span>`);
        if(w.needsCover) badges.push('<span class="badge needs">needs cover</span>');
        if(isYou) badges.push('<span class="badge you">you</span>');
        const nameCls = w.needsCover ? 'name strike' : 'name';
        const nameStyle = w.needsCover ? '' : ` style="color:${colorFor(w.memberId)}"`;
        return `<div class="week${i===0?' is-now':''}" style="--pc:${colorFor(w.memberId)}">
          <div class="range">${fmtRange(w.start,w.lastDay)} <span class="yr">${parts(w.start).y}</span></div>
          <div class="person"><span class="${nameCls}"${nameStyle}>${esc(nameOf(w.memberId))}</span></div>
          <div class="badges">${badges.join('')}
            <button class="cover-btn" data-action="cover" data-period="${w.start}">${w.overridden?'Edit':'Swap'}</button></div>
        </div>`;
      }).join('');
  const stripHtml = members.length ? `<div class="strip">${rows}</div>`
    : '<div class="empty">Add people in Setup to see the rotation.</div>';

  /* upcoming leave */
  const upcoming = leaves.filter(l=>l.end>=today).sort((a,b)=>a.start.localeCompare(b.start));
  const leaveHtml = upcoming.length ? upcoming.map(l=>`
    <div class="leave-row" style="--pc:${colorFor(l.memberId)}">
      <div><div class="l-main"><span style="color:${colorFor(l.memberId)}">${esc(nameOf(l.memberId))}</span> ${l.note?`<span class="l-note">· ${esc(l.note)}</span>`:''}</div>
      <div class="l-dates">${fmtRange(l.start,l.end)} ${parts(l.start).y}</div></div>
      <button class="btn btn-ghost btn-sm btn-danger" data-action="del-leave" data-id="${l.id}">Remove</button>
    </div>`).join('') : '<div class="empty">No leave booked. Use “Mark leave” when someone’s away.</div>';

  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><h1>Standby Roster</h1>
          <div class="sub">${esc(config.team)} · every ${cad===7?'week':cad+' days'} ${modeTag}</div></div>
        <div class="topbar-actions">
          <select class="select-inline" id="who" aria-label="Who are you">${idOptions}</select>
          ${APP.mode==='shared' ? (
            APP.session
              ? `<button class="btn btn-ghost" data-action="setup">Setup</button>
                 <button class="btn btn-ghost btn-sm" data-action="signout" title="${esc(APP.session.user.email)}">Sign out</button>`
              : `<button class="btn btn-ghost" data-action="signin">Sign in</button>`
          ) : `<button class="btn btn-ghost" data-action="setup">Setup</button>`}
        </div>
      </div>
      ${nowHtml}
      <p class="eyebrow">Rotation</p>
      ${stripHtml}
      <div class="leave-list">
        <p class="eyebrow">Leave &amp; time off</p>
        ${leaveHtml}
      </div>
    </div>`;
}

/* ---------------- modals ---------------- */
const modal = () => document.getElementById('modal');
function openModal(html){ modal().querySelector('.dialog').innerHTML=html; modal().hidden=false; }
function closeModal(){ modal().hidden=true; }

function memberOptions(sel){ return APP.state.members.map(m=>`<option value="${m.id}"${m.id===sel?' selected':''}>${esc(m.name)}</option>`).join(''); }

function openLogin(){
  openModal(`
    <h2>Sign in</h2>
    <p class="hint">Editing the team list and rotation setup is restricted to the roster admin.</p>
    <div class="field"><label>Email</label><input type="email" id="l-email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="l-pass" autocomplete="current-password"></div>
    <div id="l-error" style="color:var(--danger);font-size:13px;display:none;margin-top:-6px;margin-bottom:12px"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" data-m="close">Cancel</button>
      <button class="btn btn-primary" data-m="do-signin">Sign in</button>
    </div>`);
}

function openLeave(memberId){
  const who = memberId || APP.identity || (APP.state.members[0]&&APP.state.members[0].id) || '';
  const t = todayStr();
  openModal(`
    <h2>Mark leave</h2>
    <p class="hint">Book time off. If it lands on someone's standby week, the roster flags it so it can be swapped.</p>
    <div class="field"><label>Who's away</label><select id="m-who">${memberOptions(who)}</select></div>
    <div class="row2">
      <div class="field"><label>From</label><input type="date" id="m-from" value="${t}"></div>
      <div class="field"><label>To</label><input type="date" id="m-to" value="${t}"></div>
    </div>
    <div class="field"><label>Note (optional)</label><input type="text" id="m-note" placeholder="Annual leave, training…"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" data-m="close">Cancel</button>
      <button class="btn btn-primary" data-m="save-leave">Book leave</button>
    </div>`);
}

function openCover(periodStart){
  const st=APP.state; const ovMap={}; st.overrides.forEach(o=>ovMap[o.periodStart]=o);
  const idx = periodIndex(periodStart, st.config.startDate, st.config.cadenceDays);
  const eff = effective(idx, st.config.startDate, st.config.cadenceDays, st.members, ovMap);
  const last = periodLastDayStr(idx, st.config.startDate, st.config.cadenceDays);
  const existing = ovMap[periodStart];
  const base = eff.baseMemberId;
  openModal(`
    <h2>Swap / cover a week</h2>
    <p class="hint">Week of <b>${fmtRange(periodStart,last)}</b>. Normally <b>${esc(nameOf(base))}</b> is on. Assign someone else to cover it.</p>
    <div class="field"><label>On standby this week</label><select id="c-who">${memberOptions(existing?existing.memberId:base)}</select></div>
    <div class="field"><label>Note (optional)</label><input type="text" id="c-note" value="${existing?esc(existing.note||''):''}" placeholder="Covering for leave, swap with…"></div>
    <div class="dialog-actions">
      ${existing?'<button class="btn btn-ghost btn-danger" data-m="clear-cover" data-period="'+periodStart+'">Reset to '+esc(nameOf(base))+'</button>':''}
      <button class="btn btn-ghost" data-m="close">Cancel</button>
      <button class="btn btn-primary" data-m="save-cover" data-period="${periodStart}">Save</button>
    </div>`);
}

function openSetup(){
  const st=APP.state, c=st.config;
  const isWeeks = c.cadenceDays%7===0;
  const rows = st.members.map((m,i)=>`
    <div class="member-edit" data-mid="${m.id}">
      <span class="drag">${i+1}</span>
      <div class="member-fields">
        <input type="text" value="${esc(m.name)}" data-name placeholder="Name">
        <input type="email" value="${esc(m.email||'')}" data-email placeholder="Email (for standby reminders)">
      </div>
      <button class="btn btn-ghost btn-sm" data-m="mv-up" data-mid="${m.id}" ${i===0?'disabled':''}>↑</button>
      <button class="btn btn-ghost btn-sm" data-m="mv-down" data-mid="${m.id}" ${i===st.members.length-1?'disabled':''}>↓</button>
      <button class="btn btn-ghost btn-sm btn-danger" data-m="rm-member" data-mid="${m.id}">×</button>
    </div>`).join('');
  openModal(`
    <h2>Setup</h2>
    <p class="hint">The rotation runs through this list in order, one turn each period, then repeats. Add each person's email if you want automatic standby reminders.</p>
    <div class="field"><label>Team name</label><input type="text" id="s-team" value="${esc(c.team)}"></div>
    <div class="row2">
      <div class="field"><label>Rotation starts</label><input type="date" id="s-start" value="${c.startDate}"></div>
      <div class="field"><label>Each turn lasts</label>
        <select id="s-cad">
          <option value="7"${c.cadenceDays===7?' selected':''}>1 week</option>
          <option value="14"${c.cadenceDays===14?' selected':''}>2 weeks</option>
          <option value="1"${c.cadenceDays===1?' selected':''}>1 day</option>
          <option value="3"${c.cadenceDays===3?' selected':''}>3 days</option>
        </select></div>
    </div>
    <div class="field"><label>People in the rotation</label>
      <div id="member-rows">${rows||'<div class="empty">No one yet — add your first person.</div>'}</div>
      <button class="btn btn-ghost btn-sm" data-m="add-member" style="margin-top:8px">+ Add person</button>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" data-m="close">Cancel</button>
      <button class="btn btn-primary" data-m="save-setup">Save setup</button>
    </div>`);
}

/* setup works on a scratch copy so reordering feels live before saving */
let setupDraft=null;
function ensureDraft(){ if(!setupDraft) setupDraft=APP.state.members.map(m=>({...m})); return setupDraft; }
function redrawMembers(){
  const c=document.getElementById('member-rows'); if(!c) return;
  const list=ensureDraft();
  c.innerHTML = list.map((m,i)=>`
    <div class="member-edit" data-mid="${m.id}">
      <span class="drag">${i+1}</span>
      <div class="member-fields">
        <input type="text" value="${esc(m.name)}" data-name placeholder="Name">
        <input type="email" value="${esc(m.email||'')}" data-email placeholder="Email (for standby reminders)">
      </div>
      <button class="btn btn-ghost btn-sm" data-m="mv-up" data-mid="${m.id}" ${i===0?'disabled':''}>↑</button>
      <button class="btn btn-ghost btn-sm" data-m="mv-down" data-mid="${m.id}" ${i===list.length-1?'disabled':''}>↓</button>
      <button class="btn btn-ghost btn-sm btn-danger" data-m="rm-member" data-mid="${m.id}">×</button>
    </div>`).join('') || '<div class="empty">No one yet — add your first person.</div>';
}
function syncDraftNames(){ const list=ensureDraft();
  document.querySelectorAll('#member-rows .member-edit').forEach(row=>{
    const m=list.find(x=>x.id===row.dataset.mid); if(!m) return;
    m.name=row.querySelector('[data-name]').value;
    m.email=row.querySelector('[data-email]').value.trim(); }); }

/* ---------------- events ---------------- */
document.addEventListener('click', async (e)=>{
  const a=e.target.closest('[data-action]');
  if(a){ const act=a.dataset.action;
    if(act==='setup'){ setupDraft=null; openSetup(); }
    if(act==='leave') openLeave();
    if(act==='cover') openCover(a.dataset.period);
    if(act==='del-leave'){ if(confirm('Remove this leave?')) await APP.store.deleteLeave(a.dataset.id); }
    if(act==='signin') openLogin();
    if(act==='signout'){ await APP.store.sb.auth.signOut(); }
    return;
  }
  const m=e.target.closest('[data-m]');
  if(!m) return;
  const cmd=m.dataset.m;
  if(cmd==='close') return closeModal();
  if(cmd==='do-signin'){
    const errEl=document.getElementById('l-error');
    const { error } = await APP.store.sb.auth.signInWithPassword({ email: val('l-email').trim(), password: val('l-pass') });
    if(error){ errEl.textContent = error.message; errEl.style.display='block'; return; }
    closeModal();
  }
  if(cmd==='save-leave'){
    const rec={ id:uid(), memberId:val('m-who'), start:val('m-from'), end:val('m-to'), note:val('m-note').trim(), by:APP.identity?nameOf(APP.identity):'someone' };
    if(rec.end<rec.start){ alert('The “to” date is before the “from” date.'); return; }
    await APP.store.addLeave(rec); closeModal();
  }
  if(cmd==='save-cover'){
    await APP.store.setOverride({ periodStart:m.dataset.period, memberId:val('c-who'), note:val('c-note').trim(), by:APP.identity?nameOf(APP.identity):'someone' });
    closeModal();
  }
  if(cmd==='clear-cover'){ await APP.store.clearOverride(m.dataset.period); closeModal(); }
  if(cmd==='add-member'){ syncDraftNames(); ensureDraft().push({id:uid(),name:'',email:''}); redrawMembers(); }
  if(cmd==='rm-member'){ syncDraftNames(); setupDraft=ensureDraft().filter(x=>x.id!==m.dataset.mid); redrawMembers(); }
  if(cmd==='mv-up'||cmd==='mv-down'){ syncDraftNames(); const l=ensureDraft(); const i=l.findIndex(x=>x.id===m.dataset.mid);
    const j=cmd==='mv-up'?i-1:i+1; if(j>=0&&j<l.length){ [l[i],l[j]]=[l[j],l[i]]; redrawMembers(); } }
  if(cmd==='save-setup'){
    syncDraftNames();
    const members=ensureDraft().map(x=>({id:x.id,name:x.name.trim(),email:(x.email||'').trim()})).filter(x=>x.name);
    const cfg={ team:val('s-team').trim()||'Standby', startDate:val('s-start'), cadenceDays:parseInt(val('s-cad'),10) };
    await APP.store.saveMembers(members);
    await APP.store.saveConfig(cfg);
    setupDraft=null; closeModal();
  }
});
document.addEventListener('change', e=>{ if(e.target.id==='who') setIdentity(e.target.value); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !modal().hidden) closeModal(); });
document.addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
function val(id){ const el=document.getElementById(id); return el?el.value:''; }

/* ---------------- init ---------------- */
async function init(){
  APP.identity = localStorage.getItem(IDKEY);
  if(SUPABASE_URL && SUPABASE_ANON_KEY){
    const ok = await loadSupabase();
    if(ok && window.supabase){
      try{ const s=new SupabaseStore(SUPABASE_URL,SUPABASE_ANON_KEY); APP.state=await s.load(); APP.store=s; APP.mode='shared'; }
      catch(err){ console.error('Shared mode failed, using local:',err); }
    }
  }
  if(!APP.store){ const s=new LocalStore(); APP.state=await s.load(); APP.store=s; APP.mode='local'; }
  if(APP.mode==='shared'){
    const { data:{ session } } = await APP.store.sb.auth.getSession();
    APP.session = session;
    APP.store.sb.auth.onAuthStateChange((_event, session)=>{ APP.session=session; render(); });
  }
  // keep identity valid
  if(APP.identity && !(APP.state.members||[]).some(m=>m.id===APP.identity)) APP.identity=null;
  APP.store.subscribe(async ()=>{ try{ APP.state=await APP.store.load(); render(); }catch(e){ console.error(e); } });
  render();
}
init();
</script>
</body>
</html>
